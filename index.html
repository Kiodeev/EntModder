<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
font-family:sans-serif;
}

body{
overflow:hidden;
background:transparent;
}

/* FAB */

#fab{

position:fixed;

left:20px;
top:220px;

width:60px;
height:60px;

border-radius:100%;

background:#c8a84b;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
color:white;

z-index:99999;

box-shadow:0 0 15px rgba(0,0,0,.45);

}

/* MENU */

#menu{

position:fixed;

left:10px;
right:10px;

bottom:-500px;

height:360px;

background:#111;

border-radius:20px 20px 0 0;

transition:bottom .2s;

padding:12px;

overflow:auto;

color:white;

}

#menu.show{
bottom:0;
}

/* BUTTONS */

.btn{

background:#1d1d1d;

padding:15px;

border-radius:14px;

margin-bottom:10px;

font-size:15px;

}

.btn:active{
transform:scale(.98);
}

</style>
</head>

<body>

<div id="fab">⚙</div>

<div id="menu">

<div class="btn" onclick="tog('esp')">
ESP
</div>

<div class="btn" onclick="tog('admin')">
ADMIN
</div>

<div class="btn" onclick="tog('rainbow')">
RAINBOW
</div>

<div class="btn" onclick="tog('bombs')">
BOMBS
</div>

<div class="btn" onclick="tog('trail')">
TRAIL
</div>

</div>

<script>

var fab=document.getElementById('fab');
var menu=document.getElementById('menu');

var drag=false;

var moved=false;

var ox=0;
var oy=0;

/* MENU */

fab.onclick=function(){

if(moved){
moved=false;
return;
}

if(menu.classList.contains('show')){
menu.classList.remove('show');
}else{
menu.classList.add('show');
}

};

/* TOGGLES */

function tog(v){

_gs2call('toggle',v);

}

/* DRAG */

fab.addEventListener('touchstart',function(e){

drag=true;

ox=e.touches[0].clientX-fab.offsetLeft;
oy=e.touches[0].clientY-fab.offsetTop;

e.preventDefault();

});

document.addEventListener('touchmove',function(e){

if(!drag)return;

var x=e.touches[0].clientX-ox;
var y=e.touches[0].clientY-oy;

fab.style.left=x+'px';
fab.style.top=y+'px';

moved=true;

});

document.addEventListener('touchend',function(){

drag=false;

setTimeout(function(){
moved=false;
},100);

});

</script>

</body>
</html>
